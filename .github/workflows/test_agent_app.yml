name: Test Agent and App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên giao diện GitHub Actions

jobs:
  test-agent-app:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check syntax & import agent.py
      env:
        APP_API_KEY: ${{ secrets.APP_API_KEY }}  # <--- Sửa thành tên khớp với GitHub Secret của bạn
      run: |
        python -c "import agent; print('✅ Import agent.py thành công!')"

    - name: Check syntax for app.py
      run: |
        python -m py_compile app.py
        echo "✅ Cú pháp app.py hợp lệ!"
