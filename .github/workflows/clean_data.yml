name: Auto Run Data Cleaning

# Cho phép chạy tự động khi push code hoặc chạy thủ công từ tab Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-cleaning:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy code từ repository về máy chủ GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Cài đặt các thư viện cần thiết (Pandas, v.v.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas; fi

    # 4. Thực thi file làm sạch dữ liệu
    - name: Run data_cleaning.py
      run: python data_cleaning.py

    # 5. Tự động commit và push các file dữ liệu mới/sửa đổi lên GitHub
    - name: Commit and push cleaned files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git diff-index --quiet HEAD || (git commit -m "Auto: Cập nhật dữ liệu làm sạch bởi GitHub Actions" && git push)
